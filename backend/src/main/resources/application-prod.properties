spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
server.forward-headers-strategy=framework
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:15}
app.jwt.refresh-token-days=${JWT_REFRESH_TOKEN_DAYS:14}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.storage.provider=${STORAGE_PROVIDER:cloudinary}
app.storage.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
app.storage.cloudinary.api-key=${CLOUDINARY_API_KEY}
app.storage.cloudinary.api-secret=${CLOUDINARY_API_SECRET}
app.storage.public-base-url=${PUBLIC_API_BASE_URL}
