# ===============================
# Server
# ===============================
server.port=${PORT:8080}


# ===============================
# MySQL / Aiven
# ===============================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:photobuddy}?serverTimezone=UTC&sslMode=REQUIRED
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# ===============================
# Flyway
# ===============================
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1


# ===============================
# JWT
# ===============================
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:15}
app.jwt.refresh-token-days=${JWT_REFRESH_TOKEN_DAYS:14}


# ===============================
# CORS
# ===============================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201}


# ===============================
# Cloudinary
# ===============================
app.storage.public-base-url=${PUBLIC_API_BASE_URL:http://localhost:8080}
app.storage.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.storage.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.storage.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}