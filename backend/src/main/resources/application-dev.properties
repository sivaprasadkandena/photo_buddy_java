spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:photobuddy}?serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:15}
app.jwt.refresh-token-days=${JWT_REFRESH_TOKEN_DAYS:14}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201}
app.storage.provider=${STORAGE_PROVIDER:local}
app.storage.local-directory=${LOCAL_STORAGE_DIRECTORY:./uploads}
app.storage.public-base-url=${PUBLIC_API_BASE_URL:http://localhost:8080}
